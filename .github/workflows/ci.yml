name: Train and test

on:
  push:
  pull_request:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -r requirements.txt
      - name: Simulate data and train the model
        run: python -m ml.train --regenerate
      - name: Build the Model & data page
        run: python -m ml.report
      - name: Run tests
        run: pytest -q
      - name: Keep model metrics and weights (no data)
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            artifacts/metrics.json
            artifacts/model_weights.json
